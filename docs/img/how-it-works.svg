<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker></defs>
<rect width="1120" height="470" fill="#fff"/>
<g><rect x="20" y="40" width="200" height="90" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="120.0" y="74" text-anchor="middle" font-size="18" font-weight="700">Person or alert</text><text x="120.0" y="98" text-anchor="middle" font-size="14" fill="#444">asks in a channel, or a</text><text x="120.0" y="116" text-anchor="middle" font-size="14" fill="#444">metric crosses a threshold</text></g>
<g><rect x="270" y="40" width="200" height="90" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="370.0" y="74" text-anchor="middle" font-size="18" font-weight="700">Case channel</text><text x="370.0" y="98" text-anchor="middle" font-size="14" fill="#444">ticket, situation card,</text><text x="370.0" y="116" text-anchor="middle" font-size="14" fill="#444">people and agents together</text></g>
<g><rect x="520" y="40" width="230" height="90" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="635.0" y="74" text-anchor="middle" font-size="18" font-weight="700">Workflow (Temporal)</text><text x="635.0" y="98" text-anchor="middle" font-size="14" fill="#444">diagnose, plan, wait for a</text><text x="635.0" y="116" text-anchor="middle" font-size="14" fill="#444">person, act, verify, close</text></g>
<g><rect x="800" y="40" width="300" height="90" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="950.0" y="74" text-anchor="middle" font-size="18" font-weight="700">Agents (Pi Durable)</text><text x="950.0" y="98" text-anchor="middle" font-size="14" fill="#444">Ops, Developer, Reviewer, Insight</text><text x="950.0" y="116" text-anchor="middle" font-size="14" fill="#444">one durable conversation each</text></g>
<g><rect x="800" y="230" width="300" height="100" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="950.0" y="264" text-anchor="middle" font-size="18" font-weight="700">Tools with limits</text><text x="950.0" y="288" text-anchor="middle" font-size="14" fill="#444">read-only cluster, repo branches,</text><text x="950.0" y="306" text-anchor="middle" font-size="14" fill="#444">sandbox pod, integrations</text></g>
<g><rect x="520" y="230" width="230" height="100" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="635.0" y="264" text-anchor="middle" font-size="18" font-weight="700">Human approval</text><text x="635.0" y="288" text-anchor="middle" font-size="14" fill="#444">an approver decides; the</text><text x="635.0" y="306" text-anchor="middle" font-size="14" fill="#444">wait survives restarts</text></g>
<g><rect x="270" y="230" width="200" height="100" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="370.0" y="264" text-anchor="middle" font-size="18" font-weight="700">Live system</text><text x="370.0" y="288" text-anchor="middle" font-size="14" fill="#444">config applied, deployment</text><text x="370.0" y="306" text-anchor="middle" font-size="14" fill="#444">restarted, case closed</text></g>
<g><rect x="20" y="230" width="200" height="100" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="120.0" y="264" text-anchor="middle" font-size="18" font-weight="700">Memory</text><text x="120.0" y="288" text-anchor="middle" font-size="14" fill="#444">notes + compressed</text><text x="120.0" y="306" text-anchor="middle" font-size="14" fill="#444">history, zoomable</text></g>
<line x1="220" y1="85" x2="270" y2="85" stroke="#111" stroke-width="2" marker-end="url(#arr)"/>
<line x1="470" y1="85" x2="520" y2="85" stroke="#111" stroke-width="2" marker-end="url(#arr)"/><text x="495.0" y="77.0" text-anchor="middle" font-size="13" fill="#111" font-style="italic">starts</text>
<line x1="750" y1="85" x2="800" y2="85" stroke="#111" stroke-width="2" marker-end="url(#arr)"/><text x="775.0" y="77.0" text-anchor="middle" font-size="13" fill="#111" font-style="italic">asks</text>
<line x1="950" y1="130" x2="950" y2="230" stroke="#111" stroke-width="2" marker-end="url(#arr)"/><text x="958.0" y="180.0" text-anchor="start" font-size="13" fill="#111" font-style="italic">tool calls</text>
<line x1="800" y1="280" x2="750" y2="280" stroke="#111" stroke-width="2" marker-end="url(#arr)"/><text x="775.0" y="272.0" text-anchor="middle" font-size="13" fill="#111" font-style="italic">changes?</text>
<line x1="520" y1="280" x2="470" y2="280" stroke="#111" stroke-width="2" marker-end="url(#arr)"/><text x="495.0" y="272.0" text-anchor="middle" font-size="13" fill="#111" font-style="italic">approved</text>
<line x1="870" y1="130" x2="150" y2="230" stroke="#111" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
<text x="470" y="170" text-anchor="middle" font-size="13" fill="#111" font-style="italic" transform="rotate(-7.9 470 170) translate(0 -2)">remembers</text>

<rect x="20" y="380" width="1080" height="70" rx="6" fill="#f2f2f2" stroke="#111" stroke-width="2" stroke-dasharray="6 5"/>
<text x="560" y="408" text-anchor="middle" font-size="16" font-weight="700">The channel shows everything as it happens</text>
<text x="560" y="432" text-anchor="middle" font-size="14" fill="#333">steps, cards, charts and approval buttons. People can steer, approve, reject or stop at any point.</text>
</svg>